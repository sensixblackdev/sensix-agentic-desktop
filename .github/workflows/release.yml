name: SENSIX Desktop Release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:e2e
      - run: pnpm exec electron-builder --win nsis --publish never --config.directories.output=release
      - name: Install packaged application silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release' -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'sensix-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $executable = Get-ChildItem $installDir -Filter '*.exe' -Recurse | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $executable) { throw 'Installed executable was not found.' }
          "SENSIX_PACKAGED_EXE=$($executable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SENSIX_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke installed Electron UI
        run: pnpm run test:e2e
      - name: Teardown installed application
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like 'SENSIX*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Get-ChildItem $env:SENSIX_INSTALL_DIR -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstaller) { Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -WindowStyle Hidden }
      - name: Generate release manifest and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release' -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $manifest = @{
            version = '${{ github.ref_name }}'
            file = $installer.Name
            sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          Set-Content -LiteralPath 'release/release-manifest.json' -Value $manifest -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: sensix-agentic-desktop-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.blockmap
            release/release-manifest.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/release-manifest.json
